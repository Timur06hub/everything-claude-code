<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vintage Map Demo</title>
<style>html,body{margin:0;height:100%;background:#000}#map{width:100vw;height:100vh}</style></head>
<body><div id="map"></div>
<script src="vintage-map.js"></script>
<script>
  // ?theme=ink|paper  ?t=3.5 renders a single deterministic frame (used for stills)
  var q = new URLSearchParams(location.search);
  fetch('placeholder-config.json').then(function (r) { return r.json(); }).then(function (cfg) {
    var m = VintageMap.create(document.getElementById('map'), cfg, { theme: q.get('theme') || undefined });
    window.vintageMap = m;
    if (q.has('t')) m.render(parseFloat(q.get('t'))); else m.play();
    document.body.dataset.ready = '1';
  });
</script></body></html>
